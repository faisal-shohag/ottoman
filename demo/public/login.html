<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Login - Demo Lab</title><link rel="stylesheet" href="/style.css"></head>
<body>
<main>
  <h1>Sign in</h1>
  <p>Use <b>demo</b> / <b>demo</b>.</p>
  <form id="f">
    <label for="user">Username</label><input id="user" name="user" autocomplete="username">
    <label for="pass">Password</label><input id="pass" name="pass" type="password" autocomplete="current-password">
    <p class="error" id="err" role="alert"></p>
    <button type="submit">Sign in</button>
  </form>
</main>
<script type="module">
  import '/common.js';
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const res = await fetch('/api/login', { method: 'POST', body: JSON.stringify({ user: e.target.user.value, pass: e.target.pass.value }) });
    if (!res.ok) return (document.getElementById('err').textContent = (await res.json()).error);
    location.href = new URLSearchParams(location.search).get('next') ?? '/account.html';
  });
</script>
</body>
</html>
